name: 'Test Report'
on:
  workflow_run:
    workflows: ['Build']
    types:
      - completed
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
    - uses: dorny/test-reporter@v2
      with:
        artifact: test-results
        name: Dotnet Tests
        path: 'artifacts/test-results/*.trx'
        reporter: dotnet-trx

